<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050505">
<title>Cluster monitor</title>
<style>
:root {
  --bg: #050505;
  --panel: #0a0907;
  --line: #3b2a12;
  --line-hi: #6b4a1a;
  --amber: #ff9a1f;
  --amber-hi: #ffc266;
  --amber-dim: #a8701f;
  --amber-faint: #2a1d0b;
  --text: #f4e3c6;
  --muted: #9a8466;
  --rx: #ff9a1f;
  --tx: #35d6ff;
  --ok: #3dff8a;
  --warn: #ffd21f;
  --crit: #ff3b3b;
  --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Noto Sans Mono CJK JP", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.4 var(--mono);
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
}
/* faint scanlines over everything */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 20;
  background: repeating-linear-gradient(0deg, rgb(255 154 31 / .025) 0 1px, transparent 1px 3px);
}
main { max-width: 1480px; margin: 0 auto; padding: 0 16px 32px; }

/* ------------------------------------------------------------ top bar */
.bar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 16px; margin: 0 -16px 16px;
  background: rgb(5 5 5 / .94);
  border-bottom: 1px solid var(--line-hi);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .28em; color: var(--amber); font-size: 15px; }
.hex { width: 18px; height: 20px; background: var(--amber); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
.brand .sl { color: var(--amber-dim); letter-spacing: 0; }
.code { font-weight: 700; letter-spacing: .2em; padding: 2px 10px; border: 1px solid currentColor; }
.code.ok { color: var(--ok); }
.code.warn { color: var(--warn); }
.code.crit { color: var(--crit); }
.code.idle { color: var(--muted); }
.code .blink { display: inline-block; width: 8px; height: 8px; background: currentColor; margin-right: 8px; vertical-align: 1px; animation: blink 1.2s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .code .blink { animation: none; } }
.spacer { flex: 1; }
.clock { color: var(--amber-dim); }
.clock b { color: var(--amber-hi); font-weight: 600; }

/* ------------------------------------------------------------ alerts */
.alert {
  display: flex; align-items: stretch; margin-bottom: 16px; border: 1px solid var(--crit); color: var(--crit);
}
.alert .stripe { width: 56px; flex: none; background: repeating-linear-gradient(-45deg, var(--crit) 0 8px, transparent 8px 16px); }
.alert .msg { padding: 6px 12px; display: grid; gap: 2px; }
.alert .msg b { letter-spacing: .3em; }

/* ------------------------------------------------------------ sections */
h2 {
  display: flex; align-items: center; gap: 12px; margin: 28px 0 10px;
  font-size: 13px; font-weight: 700; letter-spacing: .3em; color: var(--amber);
}
h2 .idx { color: var(--bg); background: var(--amber); padding: 0 6px; letter-spacing: .1em; }
h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-hi), transparent); }
h2 .ctl { order: 3; display: flex; gap: 6px; font-weight: 400; letter-spacing: .1em; }

.panel { position: relative; background: var(--panel); border: 1px solid var(--line); }
.panel::before, .panel::after {
  content: ""; position: absolute; width: 10px; height: 10px; border-color: var(--amber); border-style: solid; pointer-events: none;
}
.panel::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.panel::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

/* ------------------------------------------------------------ summary */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px; }
.stat { padding: 10px 14px 12px; }
.stat .k { color: var(--muted); letter-spacing: .25em; font-size: 11px; }
.stat .v { font-size: 30px; font-weight: 700; color: var(--amber-hi); line-height: 1.15; }
.stat .v small { font-size: 14px; color: var(--amber-dim); font-weight: 400; }
.stat .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.stat .head .v { font-size: 22px; }

/* ------------------------------------------------------------ cell arrays */
.cells { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin-top: 8px; }
.cells i { display: block; aspect-ratio: 1; background: var(--amber-faint); border: 1px solid #3a2810; }
.cells i.on { background: var(--amber); border-color: var(--amber-hi); box-shadow: 0 0 5px rgb(255 154 31 / .55); }
.cells.warn i.on { background: var(--warn); border-color: #fff09a; box-shadow: 0 0 5px rgb(255 210 31 / .55); }
.cells.crit i.on { background: var(--crit); border-color: #ff9a9a; box-shadow: 0 0 6px rgb(255 59 59 / .7); }
.cells i.h-ok { background: var(--ok); border-color: #b5ffd2; box-shadow: 0 0 5px rgb(61 255 138 / .5); }
.cells i.h-run { background: #1f9e55; border-color: var(--ok); }
.cells i.h-warn { background: var(--warn); border-color: #fff09a; box-shadow: 0 0 5px rgb(255 210 31 / .55); }
.cells i.h-crit { background: var(--crit); border-color: #ff9a9a; box-shadow: 0 0 6px rgb(255 59 59 / .7); animation: blink 1.2s steps(1) infinite; }
.cells i.h-off { background: transparent; border-color: var(--muted); }
.cells.big { grid-template-columns: repeat(10, 1fr); gap: 5px; }
.cells i[data-key] { cursor: crosshair; }
.cells i.hl { outline: 2px solid var(--amber-hi); outline-offset: 1px; }
@media (prefers-reduced-motion: reduce) { .cells i.h-crit { animation: none; } }

/* ------------------------------------------------------------ meters */
.seg {
  --n: 24;
  position: relative; height: 10px; background: var(--amber-faint);
  /* the mask cuts track and fill into the same fixed segments */
  -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(100% / var(--n) - 2px), transparent calc(100% / var(--n) - 2px) calc(100% / var(--n)));
          mask: repeating-linear-gradient(90deg, #000 0 calc(100% / var(--n) - 2px), transparent calc(100% / var(--n) - 2px) calc(100% / var(--n)));
}
.seg > i { position: absolute; inset: 0 auto 0 0; display: block; background: var(--amber); }
.seg.warn > i { background: var(--warn); }
.seg.crit > i { background: var(--crit); }
.seg.thin { --n: 16; height: 4px; margin-top: 3px; }
.warn-t { color: var(--warn); }
.crit-t { color: var(--crit); }

/* ------------------------------------------------------------ nodes */
.nodes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 12px; }
.node { padding: 12px 14px 14px; }
.node.down { border-color: #4a1515; }
.node.down::before, .node.down::after { border-color: var(--crit); }
.node.off { opacity: .6; }
.node.off::before, .node.off::after { border-color: var(--muted); }
.node-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.node-head .name { font-size: 18px; font-weight: 700; color: var(--amber-hi); letter-spacing: .08em; }
.node-head .code { margin-left: auto; font-size: 11px; padding: 0 6px; }
.tag { font-size: 11px; color: var(--amber-dim); border: 1px solid var(--line-hi); padding: 0 5px; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0 10px; color: var(--muted); font-size: 12px; }
.kv b { color: var(--text); font-weight: 400; }
.rows { display: grid; grid-template-columns: max-content 1fr auto; gap: 8px 10px; align-items: center; }
.rows .l { color: var(--amber-dim); letter-spacing: .15em; font-size: 11px; }
.rows .r { text-align: right; white-space: nowrap; }
.rows .r small { color: var(--muted); }
.rows .full { grid-column: 2 / 4; }
.err { color: var(--crit); margin-top: 6px; overflow-wrap: anywhere; }
.ifaces { display: grid; grid-template-columns: auto 1fr 1fr; gap: 0 12px; font-size: 12px; color: var(--muted); }
.ifaces span:nth-child(3n+2), .ifaces span:nth-child(3n) { text-align: right; color: var(--text); }

/* ------------------------------------------------------------ sparklines */
.spark { display: block; width: 100%; height: 34px; overflow: visible;
  background: repeating-linear-gradient(0deg, transparent 0 16px, var(--amber-faint) 16px 17px); }
.spark.small { width: 110px; height: 20px; background: none; border-bottom: 1px solid var(--line); }
.inl { display: inline-flex; align-items: center; gap: 8px; }
.inl .spark.small { width: 64px; }
.spark path.line { fill: none; stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.spark path.area { opacity: .14; }
.dash { color: var(--line-hi); }

/* ------------------------------------------------------------ controls */
.btn {
  font: inherit; font-size: 11px; letter-spacing: .15em; color: var(--amber-dim); background: transparent;
  border: 1px solid var(--line-hi); padding: 2px 8px; cursor: pointer; text-transform: uppercase;
}
.btn:hover { color: var(--amber-hi); border-color: var(--amber); }
.btn[aria-pressed="true"] { color: var(--bg); background: var(--amber); border-color: var(--amber); }

/* ------------------------------------------------------------ tables */
.scroll { overflow-x: auto; overflow-y: hidden; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--amber-faint); vertical-align: middle; white-space: nowrap; }
tbody tr:hover td { background: #120d05; }
tbody tr.hl td { background: #1e1506; }
tbody tr.hl td:first-child { box-shadow: inset 3px 0 0 var(--amber); }
tbody tr.hl td.name { color: #fff; text-shadow: 0 0 8px var(--amber); }
tbody tr.hl-self td { background: #120d05; }
th { font-size: 11px; font-weight: 400; color: var(--amber-dim); letter-spacing: .2em; border-bottom: 1px solid var(--line-hi); }
th[data-sort] { cursor: pointer; user-select: none; }
th[data-sort]:hover { color: var(--amber-hi); }
th.on { color: var(--amber); }
th .arrow { font-size: 9px; }
.num { text-align: right; }
td.name { color: var(--amber-hi); }
td .dim, .dim { color: var(--muted); }
.st { display: inline-flex; align-items: center; gap: 6px; letter-spacing: .12em; font-size: 11px; }
.st::before { content: ""; width: 7px; height: 7px; background: currentColor; }
.st.ok { color: var(--ok); }
.st.off { color: var(--muted); }
.st.crit { color: var(--crit); }
.st.warn { color: var(--warn); }
.cell-meter { min-width: 104px; }
.empty { color: var(--muted); letter-spacing: .3em; text-align: center; padding: 14px; }

#tooltip {
  position: fixed; pointer-events: none; z-index: 30; display: none;
  background: var(--bg); color: var(--amber-hi); border: 1px solid var(--amber); padding: 3px 8px; font-size: 12px; white-space: nowrap;
}
</style>
</head>
<body>
<main>
  <header class="bar">
    <div class="brand"><span class="hex"></span>CLUSTER<span class="sl">//</span>MONITOR</div>
    <span class="code idle" id="code"><span class="blink"></span>INIT</span>
    <span class="spacer"></span>
    <span class="clock" id="clock"></span>
  </header>
  <div id="alert"></div>

  <section class="summary" id="summary" aria-label="Summary"></section>

  <h2><span class="idx">01</span>NODES</h2>
  <section class="nodes" id="nodes"></section>

  <h2><span class="idx">02</span>CONTAINERS<span class="ctl" id="container-ctl"></span></h2>
  <div class="panel"><div class="scroll"><table id="containers"></table></div></div>

  <h2><span class="idx">03</span>SERVICES<span class="ctl" id="service-ctl"></span></h2>
  <div class="panel"><div class="scroll"><table id="services"></table></div></div>

  <h2><span class="idx">04</span>TAILNET</h2>
  <div class="panel"><div class="scroll"><table id="tailnet"></table></div></div>
</main>
<div id="tooltip" role="tooltip"></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let state = null;
const prefs = { sort: { containers: ["memory", -1], services: ["memory", -1], tailnet: ["name", 1] }, node: "", stopped: false, small: false };
try { Object.assign(prefs, JSON.parse(localStorage.getItem("cluster-monitor") || "{}")); } catch (_) {}
const savePrefs = () => { try { localStorage.setItem("cluster-monitor", JSON.stringify(prefs)); } catch (_) {} };

// ---------------------------------------------------------------- formatting
const DASH = '<span class="dash">--</span>';
function size(n) {
  if (n == null || !isFinite(n)) return null;
  const units = ["B", "K", "M", "G", "T"];
  let i = 0;
  while (Math.abs(n) >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? Math.round(n) : n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2)) + units[i];
}
const bytes = (n) => size(n) ?? DASH;
const rate = (n) => n == null ? DASH : size(n) + "/s";
const pct = (n) => n == null || !isFinite(n) ? DASH : (n >= 10 ? n.toFixed(0) : n.toFixed(1)) + "%";
const cores = (n) => n == null ? DASH : n >= 1 ? n.toFixed(2) : n.toFixed(3);
function uptime(sec) {
  if (sec == null) return "--";
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60);
  return d ? `${d}d${String(h).padStart(2, "0")}h` : `${h}h${String(m).padStart(2, "0")}m`;
}
function since(ts) {
  if (!ts) return "--";
  const t = typeof ts === "number" ? ts * 1000 : Date.parse(ts);
  if (!isFinite(t) || t <= 0) return "--";
  return uptime(Math.max(0, (Date.now() - t) / 1000)) + " ago";
}
const utc = (d) => d.toISOString().slice(11, 19);
const level = (p) => p == null ? "" : p >= 90 ? "crit" : p >= 80 ? "warn" : "";
function seg(p, thin = false) {
  const w = p == null ? 0 : Math.max(0, Math.min(100, p));
  return `<div class="seg ${thin ? "thin" : ""} ${level(p)}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${w.toFixed(0)}"><i style="width:${w}%"></i></div>`;
}
const reqs = (n) => n == null ? DASH : n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2);
const share = (r) => r == null ? DASH : (r * 100 >= 10 ? (r * 100).toFixed(0) : (r * 100).toFixed(1)) + "%";
const lv = (p, text) => level(p) ? `<span class="${level(p)}-t">${text}</span>` : text;

// ---------------------------------------------------------------- sparklines
const sparkData = new Map();
let sparkId = 0;
function spark(series, opts = {}) {
  const id = "s" + (sparkId++);
  const { small = false, fmt = String, max = null, label = "" } = opts;
  const lines = series.filter((s) => s.values && s.values.some((v) => v != null));
  if (!lines.length) return small ? DASH : "";
  const W = 300, H = small ? 20 : 34, cap = 360;
  const top = max ?? Math.max(1e-9, ...lines.flatMap((s) => s.values.filter((v) => v != null)));
  const x = (i, len) => W - (len - 1 - i) * (W / (cap - 1));
  const y = (v) => H - 1 - (Math.min(v, top) / top) * (H - 2);
  let paths = "";
  for (const s of lines) {
    let d = "", pen = false;
    s.values.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += (pen ? "L" : "M") + x(i, s.values.length).toFixed(1) + " " + y(v).toFixed(1);
      pen = true;
    });
    if (lines.length === 1) {
      const first = s.values.findIndex((v) => v != null);
      paths += `<path class="area" fill="${s.color}" d="${d} L${W} ${H} L${x(first, s.values.length).toFixed(1)} ${H} Z"/>`;
    }
    paths += `<path class="line" stroke="${s.color}" d="${d}"/>`;
  }
  sparkData.set(id, { lines, fmt });
  return `<svg class="spark ${small ? "small" : ""}" data-spark="${id}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">${paths}</svg>`;
}
document.addEventListener("pointermove", (e) => {
  const tip = $("tooltip");
  const svg = e.target.closest && e.target.closest("svg[data-spark]");
  const d = svg && sparkData.get(svg.dataset.spark);
  if (!d) { tip.style.display = "none"; return; }
  const r = svg.getBoundingClientRect();
  const back = Math.round((1 - (e.clientX - r.left) / r.width) * 359);
  const parts = d.lines.map((s) => {
    const v = s.values[s.values.length - 1 - back];
    return `${s.name ? s.name + " " : ""}${v == null ? "--" : d.fmt(v)}`;
  });
  tip.textContent = `T-${uptime(back * (state?.interval || 10))}  ${parts.join("  ")}`;
  tip.style.display = "block";
  tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, e.clientX + 12) + "px";
  tip.style.top = (e.clientY + 14) + "px";
});

// ---------------------------------------------------------------- rendering
function nodeCode(n) {
  if (n.ok) return ["ok", "ONLINE"];
  if (n.tailnet && !n.tailnet.online) return ["off", "OFFLINE"];
  return ["crit", "NO AGENT"];
}

// container health -> [cell class, status class, label]
function health(c) {
  if (c.state !== "running") return c.exit_code ? ["h-crit", "crit", `EXIT ${c.exit_code}`] : ["h-off", "off", (c.state || "?").toUpperCase()];
  if (c.health === "unhealthy") return ["h-crit", "crit", "UNHEALTHY"];
  if (c.health === "starting") return ["h-warn", "warn", "STARTING"];
  if (c.restarts_1h) return ["h-warn", "warn", "RESTARTED"];
  return c.health === "healthy" ? ["h-ok", "ok", "HEALTHY"] : ["h-run", "ok", "RUNNING"];
}
const wkey = (w) => `${w.node}/${w.unit || w.id}`;
const wrel = (w) => (w.related || []).map((u) => `${w.node}/${u}`).join(" ");

// fixed 100-cell array lit in proportion; the level colors the lit cells
function cells(p) {
  const on = p == null ? 0 : Math.round(Math.max(0, Math.min(100, p)));
  return `<div class="cells ${level(p)}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${on}">${"<i class=on></i>".repeat(on)}${"<i></i>".repeat(100 - on)}</div>`;
}

function renderSummary(nodes) {
  const live = nodes.filter((n) => n.ok);
  const cs = live.flatMap((n) => n.containers || []);
  const running = cs.filter((c) => c.state === "running").length;
  const memT = live.reduce((a, n) => a + n.memory.total, 0), memU = live.reduce((a, n) => a + n.memory.used, 0);
  const fs = live.flatMap((n) => n.filesystems || []);
  const dT = fs.reduce((a, f) => a + f.total, 0), dU = fs.reduce((a, f) => a + f.used, 0);
  const memP = memT ? 100 * memU / memT : null, diskP = dT ? 100 * dU / dT : null;
  const stat = (k, v, body) => `<div class="panel stat"><div class="head"><span class="k">${k}</span><span class="v">${v}</span></div>${body}</div>`;
  const nodeCells = nodes.map((n) => {
    const [cls, code] = nodeCode(n);
    return `<i class="h-${cls === "ok" ? "ok" : cls === "off" ? "off" : "crit"}" title="${esc(n.name)} ${code}"></i>`;
  }).join("");
  const ctrCells = cs.slice().sort((a, b) => a.node.localeCompare(b.node) || a.name.localeCompare(b.name)).map((c) => {
    const [cls, , label] = health(c);
    return `<i class="${cls}" data-key="${esc(wkey(c))}" data-rel="${esc(wrel(c))}" title="${esc(c.name)} @${esc(c.node)}  ${label}"></i>`;
  }).join("");
  $("summary").innerHTML =
    stat("NODES", `${live.length}<small>/${nodes.length}</small>`, `<div class="cells big">${nodeCells}</div>`) +
    stat("CONTAINERS", `${running}<small>/${cs.length}</small>`, `<div class="cells big">${ctrCells}</div>`) +
    stat("MEMORY", `${lv(memP, pct(memP))}<small> ${size(memU)}/${size(memT)}</small>`, cells(memP)) +
    stat("STORAGE", `${lv(diskP, pct(diskP))}<small> ${size(dU)}/${size(dT)}</small>`, cells(diskP));
}

function renderNodes(nodes) {
  $("nodes").innerHTML = nodes.map((n) => {
    const [cls, code] = nodeCode(n);
    const tags = (n.tailnet?.tags || []).map((t) => `<span class="tag">${esc(t.replace(/^tag:/, ""))}</span>`).join("");
    const head = `<div class="node-head"><span class="name">${esc(n.name)}</span>${tags}<span class="code ${cls}">${code}</span></div>`;
    if (!n.ok) {
      return `<article class="panel node ${cls === "off" ? "off" : "down"}">${head}
        <div class="kv"><span>${esc(n.address || "--")}</span>${n.tailnet?.last_seen ? `<span>SEEN <b>${since(n.tailnet.last_seen)}</b></span>` : ""}</div>
        <div class="err">${esc(n.error || "")}</div></article>`;
    }
    const s = n.system, m = n.memory;
    const memP = 100 * m.used / m.total;
    const swapU = m.swap_total - m.swap_free, swapP = m.swap_total ? 100 * swapU / m.swap_total : null;
    const running = (n.containers || []).filter((c) => c.state === "running").length;
    const row = (l, p, r, extra = "") => `<span class="l">${l}</span>${seg(p)}<span class="r">${r}</span>${extra}`;
    const disks = (n.filesystems || []).map((f) => {
      const p = 100 * f.used / f.total;
      return row(esc(f.mount === "/" ? "/" : f.mount), p, `${lv(p, size(f.used))}<small>/${size(f.total)}</small>`);
    }).join("");
    const ifaces = (n.interfaces || []).map((i) => `<span>${esc(i.name)}</span><span>↓${rate(i.rx_rate)}</span><span>↑${rate(i.tx_rate)}</span>`).join("");
    return `<article class="panel node">${head}
      <div class="kv"><span>${esc(n.address || "")}</span><span>UP <b>${uptime(s.uptime)}</b></span><span>CPU <b>${s.cpus}</b></span>
        <span>LOAD <b>${s.load.map((l) => l.toFixed(2)).join(" ")}</b></span><span>CTR <b>${running}</b></span>
        ${s.revision ? `<span>REV <b>${esc(s.revision.slice(0, 7))}</b></span>` : ""}</div>
      ${(n.errors || []).map((e) => `<div class="err">${esc(e)}</div>`).join("")}
      <div class="rows">
        ${row("CPU", n.cpu.percent, lv(n.cpu.percent, pct(n.cpu.percent)), `<span></span><div class="full">${spark([{ values: n.cpu.history, color: "var(--amber)" }], { fmt: (v) => v.toFixed(1) + "%", max: 100, label: "CPU" })}</div>`)}
        ${row("MEM", memP, `${lv(memP, size(m.used))}<small>/${size(m.total)}</small>`, `<span></span><div class="full">${spark([{ values: m.history, color: "var(--amber)" }], { fmt: (v) => v.toFixed(1) + "%", max: 100, label: "MEM" })}</div>`)}
        ${m.swap_total ? row("SWAP", swapP, `${size(swapU)}<small>/${size(m.swap_total)}</small>`) : ""}
        ${disks}
        <span class="l">NET</span><span class="r" style="text-align:left"><span style="color:var(--rx)">↓${rate(n.network.rx_rate)}</span>&nbsp; <span style="color:var(--tx)">↑${rate(n.network.tx_rate)}</span></span><span></span>
        <span></span><div class="full">${spark([{ name: "↓", values: n.network.rx_history, color: "var(--rx)" }, { name: "↑", values: n.network.tx_history, color: "var(--tx)" }], { fmt: (v) => size(v) + "/s", label: "NET" })}</div>
        <span></span><div class="full ifaces">${ifaces}</div>
      </div>
    </article>`;
  }).join("");
}

function sortable(tableId, columns, rows, rowAttrs = () => "") {
  const [key, dir] = prefs.sort[tableId] || [columns[0].key, 1];
  const col = columns.find((c) => c.key === key) || columns[0];
  const val = col.sortValue || ((r) => r[col.key]);
  rows.sort((a, b) => {
    const va = val(a), vb = val(b);
    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return (typeof va === "string" ? va.localeCompare(vb) : va - vb) * dir;
  });
  const head = "<thead><tr>" + columns.map((c) => {
    const on = c.key === col.key;
    const sortAttr = c.sortable === false ? "" : `data-sort="${c.key}"`;
    return `<th class="${c.num ? "num" : ""} ${on ? "on" : ""}" ${sortAttr} scope="col">${c.title}${on ? ` <span class="arrow">${dir > 0 ? "▲" : "▼"}</span>` : ""}</th>`;
  }).join("") + "</tr></thead>";
  const body = "<tbody>" + (rows.length
    ? rows.map((r) => `<tr ${rowAttrs(r)}>` + columns.map((c) => `<td class="${c.num ? "num" : ""} ${c.cls || ""}"${c.title_attr ? ` title="${esc(c.title_attr(r))}"` : ""}>${c.render(r)}</td>`).join("") + "</tr>").join("")
    : `<tr><td colspan="${columns.length}" class="empty">NO DATA</td></tr>`) + "</tbody>";
  const table = $(tableId);
  table.innerHTML = head + body;
  table.querySelectorAll("th[data-sort]").forEach((th) => th.addEventListener("click", () => {
    const k = th.dataset.sort, cur = prefs.sort[tableId] || [];
    prefs.sort[tableId] = [k, cur[0] === k ? -cur[1] : (columns.find((c) => c.key === k).num ? -1 : 1)];
    savePrefs();
    render();
  }));
}

// value against a limit: "114M/128M" + thin meter; no limit shows "/∞"
function limited(used, limit, fmt) {
  if (used == null) return DASH;
  if (!limit) return `${fmt(used)}<span class="dim">/∞</span>`;
  const p = 100 * used / limit;
  return `${lv(p, fmt(used))}<span class="dim">/${fmt(limit)}</span>${seg(p, true)}`;
}
const storageTotal = (c) => {
  const s = c.storage || {};
  const m = (s.mounts || []).reduce((a, x) => a + (x.bytes || 0), 0);
  return s.rw == null && !m ? null : (s.rw || 0) + m;
};
const stateDirTotal = (s) => (s.storage || []).reduce((a, d) => a + (d.bytes || 0), 0) || null;

function controls(nodes) {
  const names = nodes.filter((n) => n.ok).map((n) => n.name);
  if (prefs.node && !names.includes(prefs.node)) prefs.node = "";
  const nodeBtns = ["", ...names].map((n) => `<button class="btn" data-node="${esc(n)}" aria-pressed="${prefs.node === n}">${esc(n || "all")}</button>`).join("");
  $("container-ctl").innerHTML = nodeBtns + `<button class="btn" data-toggle="stopped" aria-pressed="${prefs.stopped}">+exited</button>`;
  $("service-ctl").innerHTML = nodeBtns + `<button class="btn" data-toggle="small" aria-pressed="${prefs.small}">+&lt;16M</button>`;
  document.querySelectorAll("[data-node]").forEach((b) => b.addEventListener("click", () => { prefs.node = b.dataset.node; savePrefs(); render(); }));
  document.querySelectorAll("[data-toggle]").forEach((b) => b.addEventListener("click", () => { prefs[b.dataset.toggle] = !prefs[b.dataset.toggle]; savePrefs(); render(); }));
}

// requests/s and 5xx share of the last hour, for workloads behind Caddy
const httpColumn = {
  key: "http", title: "REQ/S · 5XX", num: true, sortValue: (w) => w.http?.requests_rate,
  title_attr: (w) => w.http ? [...w.http.hosts, `1h ${w.http.requests_1h} req  4xx ${share(w.http.ratio4_1h)}  5xx ${share(w.http.ratio5_1h)}`].join("\n") : "",
  render: (w) => {
    if (!w.http) return DASH;
    const r5 = w.http.ratio5_1h, p5 = r5 == null ? null : r5 * 100;
    const cls = p5 == null ? "" : p5 >= 5 ? "crit-t" : p5 >= 1 ? "warn-t" : "dim";
    return `<span class="inl">${spark([{ name: "req", values: w.history?.requests, color: "var(--amber)" }, { name: "5xx", values: w.history?.status5, color: "var(--crit)" }], { small: true, fmt: (v) => reqs(v) + "/s", label: "requests" })}` +
      `<span>${reqs(w.http.requests_rate)} <span class="${cls}">${share(r5)}</span></span></span>`;
  },
};
const related = (w) => `data-key="${esc(wkey(w))}" data-rel="${esc(wrel(w))}"`;

function renderContainers(nodes) {
  const rows = nodes.filter((n) => n.ok).flatMap((n) => n.containers || [])
    .filter((c) => (!prefs.node || c.node === prefs.node) && (prefs.stopped || c.state === "running"));
  const net = (c, dir) => {
    if (c.net === "host") return '<span class="dim">host</span>';
    if (c.net && c.net.shared_with) return `<span class="dim" title="netns of ${esc(c.net.shared_with)}">≡</span>`;
    return rate(c[`net_${dir}_rate`]);
  };
  sortable("containers", [
    { key: "name", title: "NAME", cls: "name", title_attr: (c) => c.image, render: (c) => esc(c.name) },
    { key: "node", title: "NODE", render: (c) => esc(c.node) },
    { key: "state", title: "STATE", sortValue: (c) => ["h-crit", "h-warn", "h-off", "h-run", "h-ok"].indexOf(health(c)[0]),
      render: (c) => { const [, cls, label] = health(c); return `<span class="st ${cls}" title="${esc(c.status)}${c.restarts != null ? `\nrestarts ${c.restarts}` : ""}">${label}</span>${c.restarts_1h ? ` <span class="warn-t">↻${c.restarts_1h}</span>` : ""}`; } },
    { key: "cpu", title: "CPU", num: true, cls: "cell-meter", render: (c) => limited(c.cpu, c.cpu_max, cores) },
    { key: "memory", title: "MEM", num: true, cls: "cell-meter", render: (c) => limited(c.memory, c.memory_max, size) },
    { key: "mem_trend", title: "MEM·1H", sortable: false, render: (c) => spark([{ values: c.history?.memory, color: "var(--amber)" }], { small: true, fmt: size, label: c.name }) },
    { key: "net_rx_rate", title: "RX", num: true, render: (c) => net(c, "rx") },
    { key: "net_tx_rate", title: "TX", num: true, render: (c) => net(c, "tx") },
    { key: "net_trend", title: "NET·1H", sortable: false, render: (c) => c.history?.rx ? spark([{ name: "↓", values: c.history.rx, color: "var(--rx)" }, { name: "↑", values: c.history.tx, color: "var(--tx)" }], { small: true, fmt: (v) => size(v) + "/s", label: c.name }) : DASH },
    { key: "io_write_rate", title: "IO R/W", num: true, render: (c) => c.state === "running" ? `${rate(c.io_read_rate)}<span class="dim"> / </span>${rate(c.io_write_rate)}` : DASH },
    { key: "storage", title: "DISK", num: true, sortValue: storageTotal,
      title_attr: (c) => [`rw ${size(c.storage?.rw) ?? "--"}`, ...(c.storage?.mounts || []).map((m) => `${m.destination} ${size(m.bytes)}`)].join("\n"),
      render: (c) => bytes(storageTotal(c)) },
    httpColumn,
    { key: "pids", title: "PIDS", num: true, render: (c) => c.pids == null ? DASH : limited(c.pids, c.pids_max, String) },
  ], rows, related);
}

function renderServices(nodes) {
  const rows = nodes.filter((n) => n.ok).flatMap((n) => n.services || [])
    .filter((s) => (!prefs.node || s.node === prefs.node) && (prefs.small || (s.memory || 0) >= 16 * 1024 * 1024));
  sortable("services", [
    { key: "unit", title: "UNIT", cls: "name", render: (s) => esc(s.unit.replace(/\.service$/, "")) },
    { key: "node", title: "NODE", render: (s) => esc(s.node) },
    { key: "cpu", title: "CPU", num: true, cls: "cell-meter", render: (s) => limited(s.cpu, s.cpu_max, cores) },
    { key: "memory", title: "MEM", num: true, cls: "cell-meter", render: (s) => limited(s.memory, s.memory_max, size) },
    { key: "mem_trend", title: "MEM·1H", sortable: false, render: (s) => spark([{ values: s.history?.memory, color: "var(--amber)" }], { small: true, fmt: size, label: s.unit }) },
    { key: "io_write_rate", title: "IO R/W", num: true, render: (s) => `${rate(s.io_read_rate)}<span class="dim"> / </span>${rate(s.io_write_rate)}` },
    { key: "storage", title: "STATE DIR", num: true, sortValue: stateDirTotal,
      title_attr: (s) => (s.storage || []).map((d) => `${d.path} ${size(d.bytes)}`).join("\n"),
      render: (s) => bytes(stateDirTotal(s)) },
    httpColumn,
  ], rows, related);
}

function renderTailnet(nodes) {
  sortable("tailnet", [
    { key: "name", title: "NODE", cls: "name", render: (n) => esc(n.name) },
    { key: "address", title: "ADDR", render: (n) => esc(n.address || "--") },
    { key: "tags", title: "TAGS", sortValue: (n) => (n.tailnet?.tags || []).join(","), render: (n) => (n.tailnet?.tags || []).map((t) => `<span class="tag">${esc(t.replace(/^tag:/, ""))}</span>`).join(" ") || DASH },
    { key: "online", title: "LINK", sortValue: (n) => n.tailnet?.online ? 1 : 0, render: (n) => n.tailnet?.online ? '<span class="st ok">UP</span>' : `<span class="st off">DOWN</span> <span class="dim">${since(n.tailnet?.last_seen)}</span>` },
    { key: "ok", title: "AGENT", sortValue: (n) => n.ok ? 1 : 0, render: (n) => { const [c, t] = nodeCode(n); return `<span class="st ${c}" title="${esc(n.error || "")}">${n.ok ? "OK" : t}</span>`; } },
    { key: "os", title: "SYSTEM", render: (n) => n.system ? `NixOS ${esc(n.system.nixos || "")} <span class="dim">${esc(n.system.kernel)}</span>` : esc(n.tailnet?.os || "--") },
  ], nodes.slice());
}

function renderStatus(nodes) {
  const alerts = [];
  for (const n of nodes) {
    if (!n.ok && n.tailnet?.online !== false) alerts.push(`${n.name}: ${n.error || "no agent"}`);
    if (!n.ok) continue;
    const memP = 100 * n.memory.used / n.memory.total;
    if (memP >= 90) alerts.push(`${n.name}: memory ${pct(memP)}`);
    for (const f of n.filesystems || []) if (100 * f.used / f.total >= 90) alerts.push(`${n.name}: disk ${f.mount} ${pct(100 * f.used / f.total)}`);
    for (const c of n.containers || []) if (c.memory_max && 100 * c.memory / c.memory_max >= 90) alerts.push(`${n.name}/${c.name}: memory ${pct(100 * c.memory / c.memory_max)} of limit`);
  }
  const stale = state.updated && Date.now() / 1000 - state.updated > 3 * (state.interval || 10);
  if (state.error) alerts.unshift(state.error);
  if (stale) alerts.unshift("collector stale");
  const [cls, code] = !state.updated ? ["idle", "INIT"] : stale ? ["crit", "STALE"] : alerts.length ? ["warn", "DEGRADED"] : ["ok", "NOMINAL"];
  $("code").className = "code " + cls;
  $("code").innerHTML = `<span class="blink"></span>${code}`;
  $("alert").innerHTML = alerts.length ? `<div class="alert" role="alert"><div class="stripe"></div><div class="msg"><b>WARNING</b>${alerts.map((a) => `<span>${esc(a)}</span>`).join("")}</div></div>` : "";
}

// hovering a workload lights it and every unit it depends on or that depends on it
let hoverKey = null;
function highlight() {
  document.querySelectorAll(".hl, .hl-self").forEach((el) => el.classList.remove("hl", "hl-self"));
  if (!hoverKey) return;
  const src = document.querySelector(`[data-key="${CSS.escape(hoverKey)}"]`);
  const keys = new Set([hoverKey, ...(src?.dataset.rel || "").split(" ").filter(Boolean)]);
  document.querySelectorAll("[data-key]").forEach((el) => {
    const k = el.dataset.key;
    if (keys.has(k) || (el.dataset.rel || "").split(" ").includes(hoverKey)) el.classList.add("hl", ...(k === hoverKey ? ["hl-self"] : []));
  });
}
document.addEventListener("pointerover", (e) => {
  const el = e.target.closest && e.target.closest("[data-key]");
  const key = el ? el.dataset.key : null;
  if (key !== hoverKey) { hoverKey = key; highlight(); }
});

function render() {
  if (!state) return;
  sparkData.clear();
  sparkId = 0;
  const nodes = state.nodes || [];
  renderStatus(nodes);
  renderSummary(nodes);
  renderNodes(nodes);
  controls(nodes);
  renderContainers(nodes);
  renderServices(nodes);
  renderTailnet(nodes);
  highlight();
}

function tick() {
  const age = state?.updated ? Math.round(Date.now() / 1000 - state.updated) : null;
  $("clock").innerHTML = `UTC <b>${utc(new Date())}</b>${age != null ? `  SYNC T-${age}s` : ""}${state?.collector ? `  SRC ${esc(state.collector)}` : ""}`;
}

async function poll() {
  try {
    const r = await fetch("api/state", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    state = await r.json();
  } catch (e) {
    state = { ...(state || { nodes: [] }), error: "dashboard unreachable: " + e.message };
  }
  render();
  tick();
}
poll();
setInterval(poll, 10000);
setInterval(tick, 1000);
</script>
</body>
</html>
