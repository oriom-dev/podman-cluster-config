$schema: https://kubernetesjsonschema.dev/master-standalone-strict/task-tekton-v1.json
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: generic-build-pipeline
  namespace: default
spec:
  params:
    - name: repo-url
    - name: revision
    - name: context-dir
    - name: image-name
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-repository
      taskRef:
        name: git-clone
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
    - name: build-image
      runAfter: ["fetch-repository"]
      taskRef:
        name: buildah-build
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: $(params.image-name)
        - name: CONTEXT_DIR
          value: $(params.context-dir)
