apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      nodeSelector:
        kubernetes.io/hostname: home_desktop
      containers:
        - name: minecraft
          image: itzg/minecraft-server:latest
          ports:
            - containerPort: 25565
          envFrom:
            - secretRef:
                name: minecraft-secret
